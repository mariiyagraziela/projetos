<body>

          <button onclick="escreverNoBloco()" class="salvararquivo">Salvar</button>
          <button onclick="editarArquivo()" class="editarArquivo">Editar</button>
          <button onclick="deletarNota()" class="lembrete">Deletar</buton>

        <main>
            <form id="meuformulario">
                <!--input de digitar o nome da nota -->
                <label for="">nome</label>
                <input type="text" id="notasDoInput" name="" placeholder="Digite um titulo"><br><!caixa para digitar uma nota >
                <label for="">Nota</label>
                <!--input de digitar a nota-->
                <input type="" id="anotacoesDoInput" name="" placeholder="Sua nota...">
                <!-- <button type="button" onclick="escreverNoBloco()"> enviar </button> -->
            </form> </div>
            <!--caixa que vai aparecer as notas exixtentes -->
            <div id="id_mostraanotacoes_dousuario">
                
            </div>
                
              <script type="text/javascript" href="script.js">

                    let todasAsNotas = [];
                    let notaSelecionadaContador  = null;
                    let notaSelecionaPegarID;
                    let ID ; 
                    let salvar = true;  
                    const caixa = document.getElementById('id_mostraanotacoes_dousuario');

                    function escreverNoBloco(){
                        if(salvar == true){// if 1, serve para a função de salvar uma nota nova, ou uma nota que foi editada
                            const titulo = document.getElementById("notasDoInput").value;
                            const texto = document.getElementById("anotacoesDoInput").value;
                            const caixa = document.getElementById('id_mostraanotacoes_dousuario');
                        
                            if(titulo && texto != null){
                                todasAsNotas.push(titulo);
                                todasAsNotas.push(texto);}

                            caixa.innerHTML=" ";
                            let contador = -1;
                        
                        
                            for(let i = 0; i < todasAsNotas.length; i+=2){
                                contador ++;
                            
                                let notas = document.createElement("div");
                                let notasID = "nota" + contador;
                                notas.id = notasID;
                                notas.className = "blocoNota"
                                let paragrafo = todasAsNotas[i] + "<br>" + todasAsNotas[i+1] +"</br>" ;
                                notas.innerHTML = paragrafo;
                                caixa.appendChild(notas);
                            
                                notas.onclick = function(){
                                    notaSelecionadaContador = contador;
                                    notaSelecionaPegarID = notas.id;
                                    notas.style.background = "green";
                                    console.log(notaSelecionaPegarID); 
                                    console.log(contador);
                                    return notas ;
                                }// function()
                            document.getElementById("notasDoInput").value = "";
                            document.getElementById("anotacoesDoInput").value = "";
                         
                             }// for
                        
                            }//fechamento do if 1
                        else{//Salvar arquivo novo
                            let tituloNovo = document.getElementById("notasDoInput").value;
                            let notaNova = document.getElementById("anotacoesDoInput").value;  
                            console.log(notaNova);//apagar depois
                            let paragrafoNovo = tituloNovo + "<br>" + notaNova +"</br>" ;
                            document.getElementById(notaSelecionaPegarID).innerHTML = paragrafoNovo;
                         }//else
                    document.getElementById("notasDoInput").innerHTML = "";
                    document.getElementById("anotacoesDoInput").innerHTML = "";
                          salvar = true;
                    }//fechamento function
             
                // função para deletar uma nota
                function deletarNota(){
                 //clicar na nota, e depois no botão deletar e a nota vai ser deletada    
                    if(notaSelecionadaContador != null){
                       todasAsNotas.splice(notaSelecionadaContador,2);

                       let notaPegaDaCaixa = document.getElementById(notaSelecionaPegarID);
                       notaPegaDaCaixa.remove();
                    }
                    notaSelecionadaContador = 0;
                    notaSelecionaPegarID = 0;
                   
                 }
                // função para editar a nota 
                function editarArquivo(){
                    salvar = false;
                    let posicaoDaNota = 0
                    posicaoDaNota = notaSelecionadaContador;
                    let tituloDaNota = todasAsNotas[posicaoDaNota];
                    let assuntoDanota = todasAsNotas[posicaoDaNota + 1]
         
                    console.log(todasAsNotas[posicaoDaNota]); 
                    console.log(todasAsNotas[posicaoDaNota + 1]);
                    console.log(salvar);
                    document.getElementById("notasDoInput").value = tituloDaNota;
                    document.getElementById("anotacoesDoInput").value = assuntoDanota;

                 } 
                
                </script>
