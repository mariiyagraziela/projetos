           background:#FF9671;

           position:absolute;

<body>
    <header>
        cabeça
        <nav> links </nav>
    </header>
    <section>
        <h1> Site de agenda </h1>
        <aside>
          aside mbhdbd
        </aside>
        <main>
            <form id="meuformulario">
                <label for="">nome</label>
                <input type="text" id="notas" name="" placeholder="Digite um titulo"> </input>
                <input type="" id="anotacoes" name="" placeholder="Sua nota..."></input>
                <button type="button" onclick="escreverNoBloco()"> enviar </button>
            </form>
            <div id="id_mostraanotacoes_dousuario">
                
                <script>
                    
                    function escreverNoBloco(){
                    const titulo = document.getElementById("notas").value;
                    const texto = document.getElementById("anotacoes").value;
                    if(titulo && texto !=null){
                         const titulo_texto = "<h3>" titulo + "</h3>" + "<p>"  + texto + "</p>";
                         let todasAsNotas = {};
                         todasAsNotas.push(titulo_texto);
                         document.getElementById('id_mostraanotacoes_dousuario').innerHTML =
                         "<div id='trechosDasAnotacoes_estanoScript'>"+
                             todasAsNotas.forEach((ta)=>{ta})+
                        "</div>";
                    }
          }
                </script>
            </div>
        </main>
       
    <footer>
        footer
    </footer>
    </section>
